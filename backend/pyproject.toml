[project]
name = "jp-tts-backend"
version = "0.1.0"
description = "Local Japanese TTS web app - FastAPI backend"
requires-python = ">=3.11,<3.12"
license = { text = "AGPL-3.0-only" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlmodel>=0.0.22",
    "httpx>=0.27",
    "soundfile>=0.12",
    "numpy>=1.26",
    "pyopenjtalk-plus>=0.4.0",
    "fugashi>=1.3",
    "unidic-lite>=1.0.8",
    "jaconv>=0.4",
    "ebooklib>=0.18",
    "charset-normalizer>=3.3",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-python-dateutil",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # Depends()/Field() in defaults is idiomatic FastAPI/pydantic

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
